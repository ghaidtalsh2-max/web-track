    <script>
      window.__BOOTSTRAP_ERRORS__ = [];
      window.addEventListener('error', function(e) {
        window.__BOOTSTRAP_ERRORS__.push({
          msg: e.message,
          file: e.filename,
          line: e.lineno,
          col: e.colno,
          stack: e.error ? e.error.stack : 'no stack'
        });
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__BOOTSTRAP_ERRORS__.push({
          msg: 'UnhandledRejection: ' + (e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'unknown')
        });
      });
    </script>
